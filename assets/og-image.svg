<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Asap, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1f3d"/>
      <stop offset="1" stop-color="#0e2b52"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- borda inferior verde (marca) -->
  <rect x="0" y="618" width="1200" height="12" fill="#90b728"/>

  <!-- lockup topo: símbolo + wordmark -->
  <g transform="translate(80,70) scale(0.95)">
    <path d="M18 30 L52 14 L78 38 L70 66 L34 76 L14 56 Z" fill="none" stroke="#4a8fb8" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="18" cy="30" r="7" fill="#90b728"/>
    <circle cx="52" cy="14" r="7" fill="#90b728"/>
    <circle cx="78" cy="38" r="7" fill="#90b728"/>
    <circle cx="70" cy="66" r="7" fill="#90b728"/>
    <circle cx="34" cy="76" r="7" fill="#90b728"/>
    <circle cx="14" cy="56" r="7" fill="#90b728"/>
  </g>
  <text x="185" y="138" fill="#f4f7f8" font-size="52" font-weight="700" letter-spacing="0.5">Confrontei</text>

  <!-- headline -->
  <text x="80" y="320" fill="#f4f7f8" font-size="74" font-weight="700">Converta UTM em</text>
  <text x="80" y="408" fill="#a8d640" font-size="74" font-weight="700">SIRGAS 2000</text>

  <!-- subtítulo -->
  <text x="82" y="470" fill="rgba(244,247,248,0.82)" font-size="33" font-weight="500">Coordenadas geográficas no formato aceito pelo</text>
  <text x="82" y="516" fill="rgba(244,247,248,0.82)" font-size="33" font-weight="500">SIGRI · ONR · Provimento CNJ 195/2025</text>

  <!-- assinatura -->
  <text x="80" y="586" fill="rgba(244,247,248,0.55)" font-size="26" font-weight="500">confrontei.com.br · por AG Topografia</text>
</svg>
