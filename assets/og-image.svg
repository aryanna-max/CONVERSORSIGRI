<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Poppins, Asap, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1f3d"/>
      <stop offset="1" stop-color="#0e2b52"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- borda inferior verde (marca) -->
  <rect x="0" y="618" width="1200" height="12" fill="#90b728"/>

  <!-- lockup topo: símbolo + wordmark -->
  <g transform="translate(80,68) scale(0.95)">
    <path d="M16 25 L69 16 L78 58 L52 82 L12 60 Z" fill="none" stroke="#4a8fb8" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="16" cy="25" r="7.5" fill="#90b728"/>
    <circle cx="69" cy="16" r="7.5" fill="#90b728"/>
    <circle cx="78" cy="58" r="7.5" fill="#90b728"/>
    <circle cx="52" cy="82" r="7.5" fill="#90b728"/>
    <circle cx="12" cy="60" r="7.5" fill="#90b728"/>
  </g>
  <text x="185" y="138" fill="#f4f7f8" font-size="54" font-weight="800" letter-spacing="-1">confrontei<tspan fill="#90b728">.</tspan></text>

  <!-- headline -->
  <text x="80" y="320" fill="#f4f7f8" font-size="74" font-weight="700">Converta UTM em</text>
  <text x="80" y="408" fill="#a8d640" font-size="74" font-weight="700">SIRGAS 2000</text>

  <!-- subtítulo -->
  <text x="82" y="470" fill="rgba(244,247,248,0.82)" font-size="33" font-weight="500">Coordenadas geográficas no formato aceito pelo</text>
  <text x="82" y="516" fill="rgba(244,247,248,0.82)" font-size="33" font-weight="500">SIGRI · ONR · Provimento CNJ 195/2025</text>

  <!-- assinatura -->
  <text x="80" y="586" fill="rgba(244,247,248,0.55)" font-size="26" font-weight="500">confrontei.com.br · por AG Topografia</text>
</svg>
